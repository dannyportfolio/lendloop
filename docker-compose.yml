services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-lendloop_super_secure_encryption_key_2026}
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - CONVEX_N8N_HMAC_SECRET=${CONVEX_N8N_HMAC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - N8N_CONVEX_WRITEBACK_SECRET=${N8N_CONVEX_WRITEBACK_SECRET:-secret_bearer_token_for_n8n_writeback_verification}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-http://localhost:3000}
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  n8n_data:
