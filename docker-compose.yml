services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env}
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - CONVEX_N8N_HMAC_SECRET=${CONVEX_N8N_HMAC_SECRET:?CONVEX_N8N_HMAC_SECRET must be set in .env}
      - N8N_CONVEX_WRITEBACK_SECRET=${N8N_CONVEX_WRITEBACK_SECRET:?N8N_CONVEX_WRITEBACK_SECRET must be set in .env}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-http://localhost:3000}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  n8n_data:
